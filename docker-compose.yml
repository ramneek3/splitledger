services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: splitledger
      POSTGRES_PASSWORD: splitledger
      POSTGRES_DB: splitledger
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitledger"]
      interval: 3s
      retries: 10
volumes:
  pgdata:
