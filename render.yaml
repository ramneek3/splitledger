# Render Blueprint: one web service (API + built React app) and a managed Postgres.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: splitledger
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: splitledger-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false # set in the dashboard; optional (rule-based quick add is used without it)
      - key: SEED_DEMO
        value: "true" # creates the demo account once; safe to leave on

databases:
  - name: splitledger-db
    plan: free
